# /etc/nginx/sites-available/fotochka  — замените foto.example.ru на свой поддомен
server {
    listen 80;
    server_name foto.example.ru;

    client_max_body_size 32k;   # заказ — это маленький JSON, фото к нам не загружаются
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3047;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# HTTPS добавит certbot командой: sudo certbot --nginx -d foto.example.ru
